name: echo
description: "your safety companion"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.0.2
  firebase_core: ^4.7.0
  provider: ^6.1.5+1
  json_annotation: ^4.9.0
  cloud_firestore: ^6.3.0
  firebase_auth: ^6.4.0
  record: ^6.2.0
  audioplayers: ^6.6.0
  http: ^1.6.0
  share_plus: 12.0.2
  permission_handler: ^12.0.1
  speech_to_text: ^7.3.0
  cactus: ^1.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  device_info_plus: ^11.5.0
  flutter_tts: ^4.2.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_app_icons: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/onboarding/
    - assets/onboarding/x_logo.png
    - assets/tutorial/
    - assets/splash/

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
  background_color: "#030A5C"  
  image_path: "assets/icon/echo_ic_launcher.png"  # Base image for the app icon
  adaptive_icon_background: "assets/icon/echo_echo_ic_launcher_background.png"  # For Android adaptive icons
  adaptive_icon_foreground: "assets/icon/echo_ic_launcher_foreground.png"  # For Android adaptive icons
  adaptive_icon_monochrome: "assets/icon/echo_ic_launcher_monochrome.png"  # For Android monochrome icons
  web_image_mode: center  # Options: center, contain, cover, stretch